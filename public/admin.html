<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة الوكيل — الحسابات والأرصدة</title>
<style>
  :root{--bg:#0a0c12;--card:#141824;--card2:#1c2233;--accent:#e6b143;--ok:#3fd17e;--err:#ff6b6b;--blu:#5b9dff;--txt:#eef1f8;--muted:#8b93ab;--line:#262d40}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(1100px 500px at 80% -10%,#1a2138,var(--bg));color:var(--txt);min-height:100vh}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;background:rgba(10,12,18,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{font-size:20px;font-weight:800;color:var(--accent)}
  .agentbal{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:800}
  .agentbal b{color:var(--accent)}
  a{color:var(--blu);text-decoration:none;font-size:13px}
  .wrap{max-width:1150px;margin:0 auto;padding:22px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
  h2{font-size:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
  input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-family:inherit}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .btn{padding:11px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:800;font-family:inherit;font-size:14px}
  .btn.gold{background:var(--accent);color:#1a1300}.btn.green{background:var(--ok);color:#06140a}.btn.red{background:var(--err);color:#fff}.btn.gray{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
  th{color:var(--muted);font-weight:600}
  .mini{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);width:90px;font-size:12px}
  .act{padding:7px 12px;border-radius:8px;cursor:pointer;border:0;font-weight:700;font-size:12px;margin-inline-start:5px}
  .act.add{background:#12361f;color:#7ee29a;border:1px solid #1e5e33}
  .act.sub{background:#3a1a1a;color:#ff9a9a;border:1px solid #6e2222}
  .act.zero{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
  .toast{position:fixed;bottom:22px;right:22px;min-width:260px;max-width:90vw;padding:14px 18px;border-radius:12px;font-weight:700;z-index:60;transform:translateY(220%);transition:.3s;font-size:14px}
  .toast.show{transform:translateY(0)}.toast.ok{background:#0d2f16;color:#7ee29a;border:1px solid #1e5e33}.toast.err{background:#3a1414;color:#ff9a9a;border:1px solid #6e2222}
  .warn{background:#1a1407;border:1px solid #4a3a12;color:#e8c97a;border-radius:10px;padding:11px 14px;font-size:13px;line-height:1.7;margin-bottom:14px}
  .code{font-family:monospace;font-weight:800;color:var(--blu)}
  .bal{font-weight:800;color:var(--ok)}
  .zero-bal{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo">🎛️ لوحة الوكيل — الحسابات</div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="agentbal">رصيد الوكيل: <b id="agentBal">—</b></div>
    <a href="/">واجهة اللاعب ←</a>
  </div>
</header>

<div class="wrap">
  <div class="panel" id="warnbox" style="display:none"><div class="warn" id="warnmsg"></div></div>

  <div class="panel">
    <h2>➕ إنشاء حساب لاعب جديد</h2>
    <div class="row">
      <div><label>كود الحساب (يسجّل به اللاعب الدخول)</label><input id="ncode" placeholder="مثال: player01"/></div>
      <div><label>اسم توضيحي</label><input id="nlabel" placeholder="مثال: محمد"/></div>
      <div><label>كلمة مرور (اختياري)</label><input id="npw" type="text" placeholder="فارغة = بدون كلمة"/></div>
    </div>
    <button class="btn gold" style="margin-top:14px" onclick="createAccount()">إنشاء الحساب</button>
    <div style="font-size:12px;color:var(--muted);margin-top:10px" id="curNote">جارٍ تحميل أسعار الصرف…</div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px">كل حساب جديد يُنشأ برصيد <b style="color:var(--err)">0</b> داخل منصة الألعاب. تُضيف الرصيد من الجدول أدناه.</div>
  </div>

  <div class="panel">
    <h2 style="display:flex;justify-content:space-between;align-items:center">👥 حسابات اللاعبين
      <button class="btn gray" style="font-size:12px" onclick="loadAccounts()">🔄 تحديث</button>
    </h2>
    <table>
      <thead><tr><th>كود الدخول</th><th>الاسم</th><th>الرصيد داخل اللعبة</th><th>إضافة / سحب</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" style="color:var(--muted)">جارٍ التحميل…</td></tr></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let DISP='TND', SETTLE='UAH', RATE=1;
function money(b){ if(!b) return '—'; return Number(b.display||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+b.displayCur; }
function moneySettle(b){ if(!b||b.settle==null) return ''; return ' <span style="color:var(--muted);font-size:11px">('+Number(b.settle).toLocaleString('en',{maximumFractionDigits:2})+' '+b.settleCur+')</span>'; }
async function loadStatus(){ try{const d=await api('/api/status');DISP=d.displayCur||'TND';SETTLE=d.settleCur||'UAH';RATE=d.rate||1;
  $('curNote').innerHTML='المبالغ بالدينار <b>'+DISP+'</b>. تُحوَّل تلقائياً لعملة التسوية '+SETTLE+' (1 '+SETTLE+' = '+Number(RATE).toFixed(4)+' '+DISP+').';}catch(e){} }
function toast(m,ok=true){const t=$('toast');t.textContent=m;t.className='toast show '+(ok?'ok':'err');setTimeout(()=>t.className='toast',4500);}
const api=async(p,o)=>{const r=await fetch(p,o);return r.json();};

function warnIf(blocked,msg){
  const w=$('warnbox');
  if(blocked){w.style.display='block';$('warnmsg').innerHTML='⛔ خادم اللعبة محجوب — أضف IP الخادم في لوحة Nexus → Cloudflare (IP Whitelist). '+(msg||'');}
  else w.style.display='none';
}

async function createAccount(){
  const code=$('ncode').value.trim(); const label=$('nlabel').value.trim(); const pw=$('npw').value;
  if(!code){toast('أدخل كود الحساب',false);return;}
  const d=await api('/api/agent/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,label,password:pw})});
  if(d.ok){toast(d.created?`✅ أُنشئ الحساب ${code} برصيد 0`:`الحساب ${code} موجود مسبقاً`);$('ncode').value='';$('nlabel').value='';$('npw').value='';loadAccounts();}
  else toast('فشل: '+(d.error||''),false);
}

async function loadAccounts(){
  const d=await api('/api/agent/accounts');
  warnIf(false);
  if(d.agentBalance)$('agentBal').innerHTML=money(d.agentBalance)+moneySettle(d.agentBalance);
  const tb=$('rows');
  if(!d.accounts||!d.accounts.length){tb.innerHTML='<tr><td colspan="5" style="color:var(--muted)">لا توجد حسابات بعد — أنشئ أول حساب.</td></tr>';return;}
  tb.innerHTML=d.accounts.map(a=>{
    const b=a.balance;
    const balHtml = !b? '<span style="color:var(--muted)">—</span>'
      : (Number(b.display||0)>0? `<span class="bal">${money(b)}</span>${moneySettle(b)}` : `<span class="zero-bal">0 ${b.displayCur||''}</span>`);
    return `<tr>
      <td><span class="code">${a.code}</span>${a.hasPassword?' 🔒':''}</td>
      <td>${a.label||''}</td>
      <td>${balHtml}</td>
      <td>
        <input class="mini" type="number" id="amt_${a.code}" placeholder="المبلغ (${DISP})" min="0" step="0.01"/>
      </td>
      <td style="white-space:nowrap">
        <button class="act add" onclick="deposit('${a.code}')">➕ إضافة</button>
        <button class="act sub" onclick="withdraw('${a.code}',false)">➖ سحب</button>
        <button class="act zero" onclick="withdraw('${a.code}',true)">↺ سحب الكل</button>
      </td></tr>`;
  }).join('');
}

async function deposit(code){
  const amt=Number($('amt_'+code).value||0);
  if(amt<=0){toast('أدخل مبلغاً لإضافته',false);return;}
  toast('⏳ جارٍ إضافة '+amt+' '+DISP+'…');
  const d=await api('/api/agent/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,amount:amt,currency:DISP})});
  if(d.blocked){warnIf(true);toast('محجوب: IP غير مضاف للقائمة البيضاء',false);}
  else if(d.ok){toast(`✅ أُضيف ${amt} ${DISP} لـ ${code} — رصيده الآن ${money(d.userBalance)}`);$('amt_'+code).value='';loadAccounts();}
  else toast('فشل: '+(d.msg||'خطأ'),false);
}

async function withdraw(code,all){
  let amount=0;
  if(all){ if(!confirm('سحب كامل رصيد '+code+' وإعادته لرصيد الوكيل؟'))return; }
  else { amount=Number($('amt_'+code).value||0); if(amount<=0){toast('أدخل مبلغاً للسحب أو استخدم سحب الكل',false);return;} }
  const d=await api('/api/agent/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,amount,currency:DISP,all})});
  if(d.blocked){warnIf(true);toast('محجوب: IP غير مضاف',false);}
  else if(d.ok){toast('✅ تم السحب بنجاح');$('amt_'+code).value='';loadAccounts();}
  else toast('فشل: '+(d.msg||(d.result&&d.result.msg)||'خطأ'),false);
}

loadStatus().then(loadAccounts); setInterval(loadAccounts,20000);
</script>
</body>
</html>
